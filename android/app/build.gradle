plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ai.arena.zirconcinema.ui"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // NOTE: kotlinOptions{} is intentionally omitted. This app has no Kotlin
    // sources, and the block does not exist on AGP 8.9+/9.0 when the
    // kotlin-android plugin is not applied.

    defaultConfig {
        applicationId = "ai.arena.zirconcinema.ui"
        minSdk = 36
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // Personal device beta. Replace the debug key before production distribution.
            signingConfig = signingConfigs.debug
        }
    }

    // Device beta builds are validated with explicit APK/signature checks below.
    // Disable Gradle's memory-heavy lint-vital phase in this constrained builder.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

flutter {
    source = "../.."
}
