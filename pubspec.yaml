name: zircon_cinema_ui
description: Device-specific Flutter cinema camera with a native Camera2 engine for Xiaomi 23090RA98I.
publish_to: "none"
version: 0.13.0+15

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mock_preview.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
