name: zircon_cinema_ui
description: Device-specific Flutter cinema camera with a native Camera2 engine for Xiaomi 23090RA98I.
publish_to: "none"
version: 0.15.2+17

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4

# shared_preferences_android 2.4.23 requires a newer Kotlin Gradle API than
# this deliberately Java-only Camera2 project uses. Pin the compatible Android
# implementation until the Android/Kotlin toolchain is upgraded together.
dependency_overrides:
  shared_preferences_android: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mock_preview.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
